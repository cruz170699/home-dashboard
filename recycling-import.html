<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Recycling Kalender Import</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f2f2f7; }
  .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p { color: #6b6b66; font-size: 14px; margin-bottom: 20px; }
  button { background: #007AFF; color: white; border: none; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #log { margin-top: 16px; font-size: 12px; color: #444; max-height: 300px; overflow-y: auto; background: #f7f6f3; border-radius: 8px; padding: 12px; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
<div class="card">
  <h1>🗑️ Recycling Kalender 2026</h1>
  <p>Fügt alle Kehricht-, Grüngut-, Papier-, Karton- und Sperrgutdaten für Dietlikon 2026 in deinen Familie-Kalender ein.</p>
  <button id="btn-login">Mit Google anmelden</button>
  <button id="btn-import" disabled>📅 Alle Events importieren</button>
  <div id="log">Bitte zuerst anmelden...</div>
</div>

<script>
const FAMILIE_CAL = 'homecruz.pavia@gmail.com';
const CLIENT_ID = '438929727680-b8qi3q72guf6a44u0h3g2adst8n378tv.apps.googleusercontent.com';
let token = null;

// All recycling events for Dietlikon 2026
const EVENTS = [
  // Kehrichtabfuhr (every Tuesday)
  ...['2026-01-06','2026-01-13','2026-01-20','2026-01-27',
     '2026-02-03','2026-02-10','2026-02-17','2026-02-24',
     '2026-03-03','2026-03-10','2026-03-17','2026-03-24','2026-03-31',
     '2026-04-07','2026-04-14','2026-04-21','2026-04-28',
     '2026-05-05','2026-05-12','2026-05-19','2026-05-26',
     '2026-06-02','2026-06-09','2026-06-16','2026-06-23','2026-06-30',
     '2026-07-07','2026-07-14','2026-07-21','2026-07-28',
     '2026-08-04','2026-08-11','2026-08-18','2026-08-25',
     '2026-09-01','2026-09-08','2026-09-15','2026-09-22','2026-09-29',
     '2026-10-06','2026-10-13','2026-10-20','2026-10-27',
     '2026-11-03','2026-11-10','2026-11-17','2026-11-24',
     '2026-12-01','2026-12-08','2026-12-15','2026-12-22','2026-12-29'
  ].map(d => ({ title: '🗑️ Kehrichtabfuhr', date: d, color: '11' })),

  // Grüngutabfuhr (every Wednesday, bi-weekly Jan/Feb/Dec)
  ...['2026-01-07','2026-01-21',
     '2026-02-04','2026-02-18',
     '2026-03-04','2026-03-11','2026-03-18','2026-03-25',
     '2026-04-01','2026-04-08','2026-04-15','2026-04-22','2026-04-29',
     '2026-05-06','2026-05-13','2026-05-20','2026-05-27',
     '2026-06-03','2026-06-10','2026-06-17','2026-06-24',
     '2026-07-01','2026-07-08','2026-07-15','2026-07-22','2026-07-29',
     '2026-08-05','2026-08-12','2026-08-19','2026-08-26',
     '2026-09-02','2026-09-09','2026-09-16','2026-09-23','2026-09-30',
     '2026-10-07','2026-10-14','2026-10-21','2026-10-28',
     '2026-11-04','2026-11-11','2026-11-18','2026-11-25',
     '2026-12-02','2026-12-16'
  ].map(d => ({ title: '🌿 Grüngutabfuhr', date: d, color: '10' })),

  // Papiersammlung (1st Saturday each month, except Jan/Apr/May)
  ...['2026-02-07','2026-03-07','2026-06-06','2026-07-04',
     '2026-08-01','2026-09-05','2026-10-03','2026-11-07','2026-12-05'
  ].map(d => ({ title: '📰 Papiersammlung', date: d, color: '6' })),

  // Kartonabfuhr (2nd and 4th Friday, except December)
  ...['2026-01-09','2026-01-23',
     '2026-02-13','2026-02-27',
     '2026-03-13','2026-03-27',
     '2026-04-10','2026-04-24',
     '2026-05-08','2026-05-22',
     '2026-06-12','2026-06-26',
     '2026-07-10','2026-07-24',
     '2026-08-14','2026-08-28',
     '2026-09-11','2026-09-25',
     '2026-10-09','2026-10-23',
     '2026-11-13','2026-11-27'
  ].map(d => ({ title: '📦 Kartonabfuhr', date: d, color: '5' })),

  // Sperrgut (every Tuesday same as Kehricht - selected dates from calendar)
  ...['2026-01-06','2026-02-03','2026-03-03','2026-04-07',
     '2026-05-05','2026-06-02','2026-07-07','2026-08-04',
     '2026-09-01','2026-10-06','2026-11-03','2026-12-01'
  ].map(d => ({ title: '🛋️ Sperrgut (auf Anmeldung)', date: d, color: '3' })),

  // Special dates
  { title: '🌱 Häckseldienst', date: '2026-03-23', color: '10' },
  { title: '🌱 Häckseldienst', date: '2026-04-13', color: '10' },
  { title: '🌱 Häckseldienst', date: '2026-09-28', color: '10' },
  { title: '🌱 Häckseldienst', date: '2026-10-19', color: '10' },
  { title: '♻️ Gratiskompost', date: '2026-03-20', color: '10' },
  { title: '🔩 Altmetallsammlung', date: '2026-04-09', color: '3' },
  { title: '🔩 Altmetallsammlung', date: '2026-10-22', color: '3' },
  { title: '☣️ Sonderabfallmobil Dietlikon', date: '2026-04-17', color: '11' },
  { title: '☣️ Sonderabfallmobil Dietlikon', date: '2026-10-31', color: '11' },
  { title: '🎄 Christbäume Abholung', date: '2026-01-07', color: '10' },
];

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!window.google) return;
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar',
      callback: (resp) => {
        if (resp.access_token) {
          token = resp.access_token;
          document.getElementById('btn-import').disabled = false;
          document.getElementById('log').innerHTML = '✅ Angemeldet! Bereit zum Importieren.';
        }
      }
    });
    document.getElementById('btn-login').onclick = () => client.requestAccessToken();
  }, 1000);
});

document.getElementById('btn-import').onclick = async () => {
  const log = document.getElementById('log');
  const btn = document.getElementById('btn-import');
  btn.disabled = true;
  btn.textContent = '⏳ Importiere...';
  log.innerHTML = '';
  let ok = 0, err = 0;

  for (const ev of EVENTS) {
    try {
      const r = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(FAMILIE_CAL)}/events`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          summary: ev.title,
          start: { date: ev.date },
          end: { date: ev.date },
          colorId: ev.color
        })
      });
      if (r.ok) {
        ok++;
        log.innerHTML += `<div class="ok">✓ ${ev.title} — ${ev.date}</div>`;
      } else {
        err++;
        log.innerHTML += `<div class="err">✗ ${ev.title} — ${ev.date}</div>`;
      }
      log.scrollTop = log.scrollHeight;
      await new Promise(r => setTimeout(r, 50));
    } catch(e) {
      err++;
    }
  }
  btn.textContent = `✅ Fertig! ${ok} importiert, ${err} Fehler`;
  log.innerHTML += `<div style="margin-top:8px;font-weight:600;">Fertig: ${ok} Events importiert!</div>`;
};
</script>
</body>
</html>
