<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALFIE — Mahlzeiten</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2f2f7;--surface:#fff;--surface2:rgba(120,120,128,0.12);
  --border:rgba(60,60,67,0.1);--text:#000;--text2:rgba(60,60,67,0.6);--text3:rgba(60,60,67,0.3);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;
  --radius:20px;--shadow:0 4px 20px rgba(0,0,0,0.08);
}
html,body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;height:100%;overflow:hidden;}

/* ── LOGIN ── */
#login-overlay{position:fixed;inset:0;background:#07080b;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;}
#btn-login{background:#2d2458;color:white;border:none;border-radius:14px;padding:16px 28px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:10px;}
#btn-login span{background:white;border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── LIST VIEW ── */
#list-view{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.list-header{background:var(--surface);padding:20px 20px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.list-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.list-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;}
.list-week{font-size:14px;color:var(--text2);margin-top:2px;}
.list-header-btn{padding:10px 20px;border-radius:22px;background:var(--blue);color:white;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.list-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:40px;}

/* Day row in list */
.list-day{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:0.5px solid var(--border);}
.list-day.is-today{border:2px solid var(--blue);}
.list-day-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;}
.list-day-name{font-size:20px;font-weight:700;}
.list-day-name.today-color{color:var(--blue);}
.list-day-date{font-size:13px;color:var(--text3);margin-top:2px;}
.list-day-edit{padding:8px 18px;border-radius:20px;background:var(--surface2);color:var(--blue);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.list-meals{padding:0 18px 16px;display:flex;flex-direction:column;gap:10px;}
.list-meal-row{display:flex;align-items:center;gap:12px;}
.list-meal-icon{font-size:20px;flex-shrink:0;}
.list-meal-text{font-size:17px;font-weight:500;color:var(--text);}
.list-meal-text.empty{color:var(--text3);font-style:italic;font-size:16px;}
.list-divider{height:0.5px;background:var(--border);margin:0 18px;}

/* Tabs in list */
.list-tabs{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border);flex-shrink:0;}
.list-tab{flex:1;padding:14px 0;text-align:center;font-size:15px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;}
.list-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}
.tab-panel{display:none;flex:1;overflow-y:auto;}
.tab-panel.active{display:block;}

/* ── EDIT VIEW (Swipe) ── */
#edit-view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;}
#edit-view.open{display:flex;}
.edit-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#000;flex-shrink:0;}
.edit-close{color:white;background:rgba(255,255,255,0.1);border:none;border-radius:20px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.edit-save-top{color:white;background:var(--blue);border:none;border-radius:20px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.edit-day-indicator{display:flex;gap:6px;align-items:center;}
.edit-day-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);}
.edit-day-dot.active-dot{background:white;width:20px;border-radius:4px;}

/* Swipe container */
.swipe-container{flex:1;overflow:hidden;position:relative;}
.swipe-track{display:flex;height:100%;transition:transform 0.35s cubic-bezier(.4,0,.2,1);}
.swipe-card{min-width:100%;height:100%;display:flex;flex-direction:column;padding:20px;overflow-y:auto;}

/* Card content */
.card-day-label{font-size:15px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.card-day-name{font-size:36px;font-weight:700;color:white;margin-bottom:24px;letter-spacing:-1px;}
.card-meal-section{background:rgba(255,255,255,0.07);border-radius:18px;padding:20px;margin-bottom:16px;}
.card-meal-label{font-size:13px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-meal-input{width:100%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:16px;font-size:19px;font-family:'Inter',sans-serif;color:white;outline:none;}
.card-meal-input::placeholder{color:rgba(255,255,255,0.3);}
.card-meal-input:focus{border-color:var(--blue);background:rgba(0,122,255,0.1);}
.card-fav-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.card-fav-chip{padding:8px 16px;background:rgba(255,255,255,0.1);border-radius:20px;font-size:14px;font-weight:500;color:rgba(255,255,255,0.8);cursor:pointer;border:1px solid rgba(255,255,255,0.15);}
.card-fav-chip:active{background:var(--blue);}
.card-bring-btn{width:100%;padding:16px;border-radius:14px;background:rgba(52,199,89,0.15);border:1.5px solid rgba(52,199,89,0.3);color:#34C759;font-size:16px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* Nav arrows */
.swipe-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#000;flex-shrink:0;}
.swipe-arrow{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.swipe-arrow:disabled{opacity:0.2;}
.swipe-center-info{text-align:center;}
.swipe-day-num{font-size:18px;font-weight:700;color:white;}
.swipe-day-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;}

/* ── BRING MODAL ── */
#bring-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;}
#bring-modal.open{display:flex;}
.bring-sheet{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:500px;padding:24px 20px 48px;animation:slideUp 0.3s cubic-bezier(.4,0,.2,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.bring-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 20px;}
.bring-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.bring-sub{font-size:15px;color:var(--text2);margin-bottom:18px;}
.bring-items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:220px;overflow-y:auto;}
.bring-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface2);border-radius:14px;}
.bring-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.bring-check.on{background:var(--green);border-color:var(--green);}
.bring-check.on::after{content:'✓';color:white;font-size:14px;font-weight:700;}
.bring-item-txt{font-size:17px;flex:1;}
.bring-input-row{display:flex;gap:10px;margin-bottom:14px;}
.bring-add-input{flex:1;background:var(--surface2);border:none;border-radius:14px;padding:14px 16px;font-size:16px;font-family:'Inter',sans-serif;color:var(--text);outline:none;}
.bring-add-mini{padding:14px 20px;border-radius:14px;background:var(--green);color:white;border:none;font-size:20px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.bring-confirm{width:100%;padding:18px;border-radius:16px;background:var(--green);color:white;border:none;font-size:18px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.bring-cancel{width:100%;padding:16px;border-radius:16px;background:var(--surface2);color:var(--text2);border:none;font-size:16px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px;}

/* ── FAVORITES ── */
.fav-list{padding:16px;display:flex;flex-direction:column;gap:10px;}
.fav-section-hd{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);padding:4px 4px 8px;}
.fav-row{display:flex;align-items:center;padding:16px 18px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);gap:14px;}
.fav-emoji{font-size:26px;width:36px;text-align:center;}
.fav-info{flex:1;}
.fav-name{font-size:18px;font-weight:600;}
.fav-type{font-size:13px;color:var(--text3);margin-top:2px;}
.fav-del{width:34px;height:34px;border-radius:50%;background:#fce7f3;border:none;cursor:pointer;color:var(--red);font-size:18px;display:flex;align-items:center;justify-content:center;}
.add-fav-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.add-fav-title{font-size:18px;font-weight:700;margin-bottom:16px;}
.add-fav-input{width:100%;background:var(--surface2);border:none;border-radius:14px;padding:16px;font-size:17px;font-family:'Inter',sans-serif;color:var(--text);outline:none;margin-bottom:12px;}
.add-fav-types{display:flex;gap:8px;margin-bottom:14px;}
.type-btn{flex:1;padding:12px 8px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-align:center;transition:all 0.15s;}
.type-btn.sel{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
.add-fav-btn{width:100%;padding:16px;border-radius:14px;background:var(--blue);color:white;border:none;font-size:17px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:white;padding:14px 24px;border-radius:24px;font-size:15px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <svg width="260" height="191" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bgr2" cx="50%" cy="45%" r="65%"><stop offset="0%" stop-color="#0e1117"/><stop offset="100%" stop-color="#07080b"/></radialGradient>
      <radialGradient id="halo3" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#7B61FF" stop-opacity="0.2"/><stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="680" height="500" fill="url(#bgr2)" rx="20"/>
    <ellipse cx="340" cy="210" rx="260" ry="190" fill="url(#halo3)"/>

    <text x="340" y="224" text-anchor="middle" font-family="Inter,sans-serif" font-size="66" font-weight="700" fill="#C4B0FF" textLength="280" lengthAdjust="spacing">ALFIE</text>
    <text x="340" y="318" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#9B85FF" textLength="200" lengthAdjust="spacing">HOME ASSISTANT</text>

    Mit Google anmelden
  </button>
</div>

<!-- LIST VIEW -->
<div id="list-view">
  <div class="list-header">
    <div class="list-header-top">
      <div>
        <div class="list-title">🍽️ Mahlzeiten</div>
        <div class="list-week" id="week-label">Laden...</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="list-header-btn" style="background:var(--surface2);color:var(--text2);" onclick="copyLastWeek()">📋</button>
        <button class="list-header-btn" style="background:var(--surface2);color:var(--text2);" onclick="getMobileSuggestions()">✨</button>
      </div>
    </div>
  </div>
  <div class="list-tabs">
    <button class="list-tab active" onclick="switchListTab('week',this)">Diese Woche</button>
    <button class="list-tab" onclick="switchListTab('favs',this)">⭐ Favoriten</button>
  </div>
  <div class="tab-panel active" id="panel-week">
    <div class="list-scroll" id="days-list"></div>
  </div>
  <div class="tab-panel" id="panel-favs">
    <div class="fav-list">
      <div id="favs-list"></div>
      <div class="add-fav-card">
        <div class="add-fav-title">➕ Favorit hinzufügen</div>
        <input class="add-fav-input" id="new-fav-name" placeholder="Mahlzeit eingeben...">
        <div class="add-fav-types">
          <button class="type-btn sel" id="type-lunch" onclick="selType('Mittagessen')">☀️ Mittag</button>
          <button class="type-btn" id="type-dinner" onclick="selType('Abendessen')">🌙 Abend</button>
          <button class="type-btn" id="type-both" onclick="selType('Beides')">🍽️ Beides</button>
        </div>
        <button class="add-fav-btn" onclick="addFavorite()">Favorit speichern ⭐</button>
      </div>
    </div>
  </div>
</div>

<!-- EDIT VIEW -->
<div id="edit-view">
  <div class="edit-topbar">
    <button class="edit-close" onclick="closeEditView()">✕ Schliessen</button>
    <div class="edit-day-indicator" id="day-dots"></div>
    <button class="edit-save-top" onclick="saveCurrentCard()">Speichern</button>
  </div>
  <div class="swipe-container" id="swipe-container">
    <div class="swipe-track" id="swipe-track"></div>
  </div>
  <div class="swipe-nav">
    <button class="swipe-arrow" id="prev-btn" onclick="prevDay()">‹</button>
    <div class="swipe-center-info">
      <div class="swipe-day-num" id="swipe-day-label">—</div>
      <div class="swipe-day-sub" id="swipe-day-date">—</div>
    </div>
    <button class="swipe-arrow" id="next-btn" onclick="nextDay()">›</button>
  </div>
</div>

<!-- BRING MODAL -->
<div id="bring-modal" onclick="if(event.target===this)closeBring()">
  <div class="bring-sheet">
    <div class="bring-handle"></div>
    <div class="bring-title">🛒 Zu Bring! hinzufügen</div>
    <div class="bring-sub" id="bring-sub">Welche Zutaten brauchst du?</div>
    <div class="bring-items-list" id="bring-items-list"></div>
    <div class="bring-input-row">
      <input class="bring-add-input" id="bring-new-item" placeholder="Zutat hinzufügen..." onkeydown="if(event.key==='Enter')addBringInputItem()">
      <button class="bring-add-mini" onclick="addBringInputItem()">+</button>
    </div>
    <button class="bring-confirm" onclick="confirmBringAdd()">✓ Zu Bring! hinzufügen</button>
    <button class="bring-cancel" onclick="closeBring()">Abbrechen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG={
  GCAL_CLIENT_ID:'438929727680-b8qi3q72guf6a44u0h3g2adst8n378tv.apps.googleusercontent.com',
  SHEETS_API_KEY:'AIzaSyCjaHl6Sj0iTn9RFHl4JIP5ZsDzGV-wZKE',
  SHEETS_ID:'1cc79Ey2ovmerwijlfcaZc171KFYI6l-Id47lEAjEjoM',
  HA_URL:'https://ha.ha-cruz.com',
  HA_TOKEN:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI1MTI2MmRkYTlmMjI0MWYxYmE2MzQ2MzA4YjJlZGZlZiIsImlhdCI6MTc3ODMxNzk5NywiZXhwIjoyMDkzNjc3OTk3fQ.rHHRurKg5F4gfxEaHvVVs4ml-yWCZv0-OjBp5H9ppck',
  BRING_ENTITY:'todo.pavia_cruz_home_assistent',
};
const HA_HEADERS={'Authorization':`Bearer ${CONFIG.HA_TOKEN}`,'Content-Type':'application/json'};
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DAY_JS=[1,2,3,4,5,6,0];

let oauthToken=null,mealData=[],favorites=[],currentDayIdx=0,bringItems=[],selFavType='Mittagessen';

// ── AUTH ──
function initOAuth(){
  const client=google.accounts.oauth2.initTokenClient({
    client_id:CONFIG.GCAL_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    callback:(resp)=>{
      if(resp.access_token){
        oauthToken=resp.access_token;
        document.getElementById('login-overlay').style.display='none';
        loadAll();
      }
    }
  });
  document.getElementById('btn-login').onclick=()=>client.requestAccessToken();
}
window.addEventListener('load',()=>{setTimeout(()=>{if(window.google)initOAuth();else setTimeout(initOAuth,1500);},500);});

async function loadAll(){await loadMeals();await loadFavorites();}

// ── MEALS ──
async function loadMeals(){
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/Sheet1!A1:H3?key=${CONFIG.SHEETS_API_KEY}`);
    const d=await r.json();const rows=d.values||[];
    mealData=[];
    const today=new Date();
    const todayDay=today.getDay();
    const mondayOffset=todayDay===0?-6:1-todayDay;
    const monday=new Date(today);monday.setDate(today.getDate()+mondayOffset);
    for(let i=0;i<7;i++){
      const date=new Date(monday);date.setDate(monday.getDate()+i);
      mealData.push({day:DAYS[i],jsDay:DAY_JS[i],colLetter:String.fromCharCode(66+i),lunch:rows[1]?.[i+1]||'—',dinner:rows[2]?.[i+1]||'—',date});
    }
    renderList();
    const mon=mealData[0].date,sun=mealData[6].date;
    document.getElementById('week-label').textContent=`${mon.getDate()}.${mon.getMonth()+1} – ${sun.getDate()}.${sun.getMonth()+1}.${sun.getFullYear()}`;
  }catch(e){showToast('Fehler beim Laden');}
}

function renderList(){
  const container=document.getElementById('days-list');container.innerHTML='';
  const today=new Date();
  mealData.forEach((m,i)=>{
    const isToday=m.date.toDateString()===today.toDateString();
    const el=document.createElement('div');
    el.className='list-day'+(isToday?' is-today':'');
    el.innerHTML=`
      <div class="list-day-header">
        <div>
          <div class="list-day-name ${isToday?'today-color':''}">${isToday?'📍 Heute':m.day}</div>
          <div class="list-day-date">${m.date.getDate()}.${m.date.getMonth()+1}.</div>
        </div>
        <button class="list-day-edit" onclick="openEditView(${i})">✏️ Bearbeiten</button>
      </div>
      <div class="list-meals">
        <div class="list-meal-row">
          <div class="list-meal-icon">☀️</div>
          <div class="list-meal-text ${!m.lunch||m.lunch==='—'?'empty':''}">${!m.lunch||m.lunch==='—'?'Noch nicht geplant':m.lunch}</div>
        </div>
        <div class="list-divider"></div>
        <div class="list-meal-row">
          <div class="list-meal-icon">🌙</div>
          <div class="list-meal-text ${!m.dinner||m.dinner==='—'?'empty':''}">${!m.dinner||m.dinner==='—'?'Noch nicht geplant':m.dinner}</div>
        </div>
      </div>`;
    container.appendChild(el);
  });
}

// ── EDIT VIEW ──
function openEditView(startIdx){
  currentDayIdx=startIdx;
  buildSwipeCards();
  updateSwipeUI();
  document.getElementById('edit-view').classList.add('open');
}

function closeEditView(){
  document.getElementById('edit-view').classList.remove('open');
  renderList();
}

function buildSwipeCards(){
  const track=document.getElementById('swipe-track');track.innerHTML='';
  mealData.forEach((m,i)=>{
    const lunchFavs=favorites.filter(f=>f.type==='Mittagessen'||f.type==='Beides');
    const dinnerFavs=favorites.filter(f=>f.type==='Abendessen'||f.type==='Beides');
    const card=document.createElement('div');
    card.className='swipe-card';
    card.innerHTML=`
      <div class="card-day-label">Tag ${i+1} von 7</div>
      <div class="card-day-name">${m.day}</div>
      <div class="card-meal-section">
        <div class="card-meal-label">☀️ Mittagessen</div>
        <input class="card-meal-input" id="lunch-${i}" placeholder="Was gibt es zu Mittag?" value="${m.lunch==='—'?'':m.lunch}">
        ${lunchFavs.length?`<div class="card-fav-chips">${lunchFavs.map(f=>`<div class="card-fav-chip" onclick="document.getElementById('lunch-${i}').value='${f.name}'">${f.emoji} ${f.name}</div>`).join('')}</div>`:''}
      </div>
      <div class="card-meal-section">
        <div class="card-meal-label">🌙 Abendessen</div>
        <input class="card-meal-input" id="dinner-${i}" placeholder="Was gibt es zum Abend?" value="${m.dinner==='—'?'':m.dinner}">
        ${dinnerFavs.length?`<div class="card-fav-chips">${dinnerFavs.map(f=>`<div class="card-fav-chip" onclick="document.getElementById('dinner-${i}').value='${f.name}'">${f.emoji} ${f.name}</div>`).join('')}</div>`:''}
      </div>
      <button class="card-bring-btn" onclick="openBringForDay(${i})">🛒 Zutaten zu Bring! hinzufügen</button>
    `;
    track.appendChild(card);
  });
  // Dots
  const dots=document.getElementById('day-dots');dots.innerHTML='';
  mealData.forEach((_,i)=>{const d=document.createElement('div');d.className='edit-day-dot';d.id=`dot-${i}`;dots.appendChild(d);});
  goToDay(currentDayIdx,false);
}

function goToDay(idx,animate=true){
  currentDayIdx=idx;
  const track=document.getElementById('swipe-track');
  if(!animate)track.style.transition='none';
  track.style.transform=`translateX(-${idx*100}%)`;
  if(!animate)setTimeout(()=>track.style.transition='',50);
  updateSwipeUI();
}

function updateSwipeUI(){
  const m=mealData[currentDayIdx];
  document.getElementById('swipe-day-label').textContent=m.day;
  document.getElementById('swipe-day-date').textContent=`${m.date.getDate()}.${m.date.getMonth()+1}.`;
  document.getElementById('prev-btn').disabled=currentDayIdx===0;
  document.getElementById('next-btn').disabled=currentDayIdx===6;
  document.querySelectorAll('.edit-day-dot').forEach((d,i)=>{d.className='edit-day-dot'+(i===currentDayIdx?' active-dot':'');});
}

function prevDay(){if(currentDayIdx>0){saveCurrentCard(false);goToDay(currentDayIdx-1);}}
function nextDay(){if(currentDayIdx<6){saveCurrentCard(false);goToDay(currentDayIdx+1);}}

async function saveCurrentCard(showMsg=true){
  const i=currentDayIdx;
  const lunch=document.getElementById(`lunch-${i}`)?.value.trim()||'—';
  const dinner=document.getElementById(`dinner-${i}`)?.value.trim()||'—';
  mealData[i].lunch=lunch;mealData[i].dinner=dinner;
  try{
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/${mealData[i].colLetter}2:${mealData[i].colLetter}3?valueInputOption=RAW`,{
      method:'PUT',headers:{'Authorization':`Bearer ${oauthToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({values:[[lunch],[dinner]]})
    });
    if(showMsg)showToast('✅ Gespeichert!');
  }catch(e){if(showMsg)showToast('Fehler!');}
}

// Touch/swipe support
let touchStartX=0;
document.getElementById('swipe-container').addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('swipe-container').addEventListener('touchend',e=>{
  const diff=touchStartX-e.changedTouches[0].clientX;
  if(Math.abs(diff)>60){if(diff>0)nextDay();else prevDay();}
},{passive:true});

// ── FAVORITES ──
async function loadFavorites(){
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/Favorites!A:C`,{headers:{'Authorization':`Bearer ${oauthToken}`}});
    const d=await r.json();
    if(d.error){await createFavSheet();favorites=[];}
    else{favorites=(d.values||[]).filter(r=>r[0]).map(r=>({name:r[0],type:r[1]||'Beides',emoji:r[2]||'🍽️'}));}
    renderFavs();
  }catch(e){favorites=[];renderFavs();}
}

async function createFavSheet(){
  try{await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}:batchUpdate`,{method:'POST',headers:{'Authorization':`Bearer ${oauthToken}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:'Favorites'}}}]})});}catch(e){}
}

async function saveFavorites(){
  try{await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/Favorites!A:C?valueInputOption=RAW`,{method:'PUT',headers:{'Authorization':`Bearer ${oauthToken}`,'Content-Type':'application/json'},body:JSON.stringify({values:favorites.map(f=>[f.name,f.type,f.emoji])})});}catch(e){}
}

async function addFavorite(){
  const name=document.getElementById('new-fav-name').value.trim();if(!name)return;
  const emojis={'Mittagessen':'☀️','Abendessen':'🌙','Beides':'🍽️'};
  favorites.push({name,type:selFavType,emoji:emojis[selFavType]});
  document.getElementById('new-fav-name').value='';
  renderFavs();await saveFavorites();showToast('⭐ Favorit gespeichert!');
}

async function deleteFav(idx){favorites.splice(idx,1);renderFavs();await saveFavorites();showToast('Gelöscht');}

function renderFavs(){
  const container=document.getElementById('favs-list');container.innerHTML='';
  if(!favorites.length){container.innerHTML='<div style="padding:16px;color:var(--text3);font-size:16px;text-align:center;">Noch keine Favoriten</div>';return;}
  const lunch=favorites.filter(f=>f.type==='Mittagessen'||f.type==='Beides');
  const dinner=favorites.filter(f=>f.type==='Abendessen'||f.type==='Beides');
  let html='';
  if(lunch.length){html+=`<div class="fav-section-hd">☀️ Mittagessen</div>`;html+=lunch.map(f=>`<div class="fav-row"><div class="fav-emoji">${f.emoji}</div><div class="fav-info"><div class="fav-name">${f.name}</div><div class="fav-type">${f.type}</div></div><button class="fav-del" onclick="deleteFav(${favorites.indexOf(f)})">✕</button></div>`).join('');}
  if(dinner.length){html+=`<div class="fav-section-hd" style="margin-top:14px;">🌙 Abendessen</div>`;html+=dinner.map(f=>`<div class="fav-row"><div class="fav-emoji">${f.emoji}</div><div class="fav-info"><div class="fav-name">${f.name}</div><div class="fav-type">${f.type}</div></div><button class="fav-del" onclick="deleteFav(${favorites.indexOf(f)})">✕</button></div>`).join('');}
  container.innerHTML=html;
}

function selType(type){
  selFavType=type;
  ['lunch','dinner','both'].forEach(t=>document.getElementById('type-'+t)?.classList.remove('sel'));
  const map={'Mittagessen':'lunch','Abendessen':'dinner','Beides':'both'};
  document.getElementById('type-'+map[type])?.classList.add('sel');
}

// ── BRING ──
function openBringForDay(idx){
  const m=mealData[idx];
  bringItems=[];
  const lunch=document.getElementById(`lunch-${idx}`)?.value.trim()||m.lunch;
  const dinner=document.getElementById(`dinner-${idx}`)?.value.trim()||m.dinner;
  [lunch,dinner].filter(x=>x&&x!=='—').forEach(meal=>bringItems.push({name:meal,checked:true}));
  document.getElementById('bring-sub').textContent=`Für ${m.day}`;
  renderBringItems();document.getElementById('bring-modal').classList.add('open');
}

function renderBringItems(){
  document.getElementById('bring-items-list').innerHTML=bringItems.map((item,i)=>`
    <div class="bring-item">
      <div class="bring-check ${item.checked?'on':''}" onclick="toggleBring(${i})"></div>
      <div class="bring-item-txt">${item.name}</div>
    </div>`).join('');
}

function toggleBring(idx){bringItems[idx].checked=!bringItems[idx].checked;renderBringItems();}
function addBringInputItem(){const input=document.getElementById('bring-new-item');const val=input.value.trim();if(!val)return;bringItems.push({name:val,checked:true});input.value='';renderBringItems();}

async function confirmBringAdd(){
  const toAdd=bringItems.filter(i=>i.checked);if(!toAdd.length){closeBring();return;}
  let added=0;
  for(const item of toAdd){try{await fetch(`${CONFIG.HA_URL}/api/services/todo/add_item`,{method:'POST',headers:HA_HEADERS,body:JSON.stringify({entity_id:CONFIG.BRING_ENTITY,item:item.name})});added++;}catch(e){}}
  closeBring();showToast(`🛒 ${added} Artikel zu Bring! hinzugefügt!`);
}

function closeBring(){document.getElementById('bring-modal').classList.remove('open');bringItems=[];}

// ── COPY LAST WEEK ──
async function copyLastWeek(){
  showToast('📋 Lade letzte Woche...');
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/History!A:O`,{headers:{'Authorization':`Bearer ${oauthToken}`}});
    const d=await r.json();const rows=d.values||[];
    if(rows.length<2){showToast('Keine Daten gefunden');return;}
    const last=rows[rows.length-1];
    for(let i=0;i<7;i++){
      const col=String.fromCharCode(66+i);
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEETS_ID}/values/${col}2:${col}3?valueInputOption=RAW`,{method:'PUT',headers:{'Authorization':`Bearer ${oauthToken}`,'Content-Type':'application/json'},body:JSON.stringify({values:[[last[1+i*2]||'—'],[last[2+i*2]||'—']]})});
    }
    await loadMeals();showToast('📋 Letzte Woche übernommen!');
  }catch(e){showToast('Fehler');}
}

// ── AI ──
async function getMobileSuggestions(){
  showToast('✨ KI denkt nach...');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:`Schlage Mahlzeiten für ein Schweizer Pärchen vor. Nur JSON:\n{"montag":{"lunch":"...","dinner":"..."},"dienstag":{"lunch":"...","dinner":"..."},"mittwoch":{"lunch":"...","dinner":"..."},"donnerstag":{"lunch":"...","dinner":"..."},"freitag":{"lunch":"...","dinner":"..."},"samstag":{"lunch":"...","dinner":"..."},"sonntag":{"lunch":"...","dinner":"..."}}\nFavoriten: ${favorites.map(f=>f.name).join(', ')}`}]})});
    const data=await resp.json();
    const json=JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim());
    const keys=['montag','dienstag','mittwoch','donnerstag','freitag','samstag','sonntag'];
    keys.forEach((k,i)=>{if(json[k]){mealData[i].lunch=json[k].lunch;mealData[i].dinner=json[k].dinner;}});
    renderList();showToast('✨ Vorschläge geladen!');
  }catch(e){showToast('Fehler');}
}

// ── HELPERS ──
function switchListTab(tab,btn){
  document.querySelectorAll('.list-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='favs')renderFavs();
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
